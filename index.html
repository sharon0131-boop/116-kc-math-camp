<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="卓越盃數學營專案盤點與任務追蹤">
<title>卓越盃專案盤點台</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="brand-mark">卓</div><div><h1>卓越盃專案盤點台</h1><small>2027 資優數學營</small></div></div>
  <div class="top-actions"><span class="save-state" id="saveState">載入專案資料…</span><button class="top-btn" id="exportBtn">匯出備份</button><button class="top-btn" id="importBtn">匯入資料</button><input id="importFile" type="file" accept="application/json,.json" hidden></div>
</header>
<main class="shell">
  <section class="hero"><div><div class="eyebrow">PROJECT DESK</div><h2 id="pageTitle">全案狀況</h2><p id="pageSubtitle">先看需要決策與推進的事項，再進入任務明細。</p></div><div class="camp-chip">營期日期待確認｜1/30 或 1/31</div></section>
  <nav class="nav" aria-label="主要頁面"><button class="active" data-view="overview">專案總覽</button><button data-view="tasks">任務清單</button><button data-view="timeline">時程盤點</button></nav>
  <section class="panel active" id="overviewPanel">
    <div class="alert"><div class="alert-icon">!</div><div><strong>待決事項：確認 2027 營期終日</strong><p>兩份來源資料分別標示 1/30 與 1/31。確認後再同步更新對外文宣、學校需求與行前安排。</p></div></div>
    <div class="metrics" id="metrics"></div>
    <div class="section-head"><h3>負責單位</h3><span>區塊依來源表的討論對象分類</span></div>
    <div class="teams" id="teamCards"></div>
    <div class="grid-two">
      <div class="box"><h3>現階段建議先處理</h3><div id="focusList"></div></div>
      <div class="box"><h3>七天內到期</h3><div id="upcomingList"></div></div>
    </div>
  </section>
  <section class="panel" id="tasksPanel">
    <div class="section-head"><h3>任務清單</h3><span>點選任務可更新日期、負責人與進度</span></div>
    <div class="toolbar">
      <input class="control search" id="searchInput" placeholder="搜尋任務、負責人或備註…" aria-label="搜尋任務">
      <select class="control" id="statusFilter"><option value="">所有狀態</option></select>
      <select class="control" id="phaseFilter"><option value="">所有類型</option></select>
      <button class="primary" id="addTask">＋ 新增任務</button>
    </div>
    <div class="filters" id="teamFilters"></div>
    <div class="result-bar"><span id="resultCount"></span><div class="page-controls" id="pageControls"></div></div>
    <div class="table-wrap"><table class="task-table"><thead><tr><th>工作項目</th><th>負責單位</th><th>類型</th><th>預估開始日</th><th>實際完成日</th><th>負責人</th><th>狀態</th></tr></thead><tbody id="taskRows"></tbody></table></div>
  </section>
  <section class="panel" id="timelinePanel">
    <div class="section-head"><h3>時程盤點</h3><span>按年度月份整理來源時程；空白日期需補排</span></div>
    <div class="alert"><div class="alert-icon">i</div><div><strong id="timelineAlertTitle"></strong><p id="timelineAlertText"></p></div></div>
    <div class="timeline" id="timelineGrid"></div>
  </section>
</main>
<dialog id="taskDialog">
  <div class="dialog-head"><div><h3 id="dialogTitle">編輯任務</h3><small id="dialogMeta"></small></div><button class="close" id="closeDialog" aria-label="關閉">×</button></div>
  <form id="taskForm">
    <div class="form">
      <div class="field full"><label for="fTitle">工作項目</label><input id="fTitle" required></div>
      <div class="field"><label for="fType">類型</label><select id="fType"></select></div>
      <div class="field"><label for="fTeam">負責單位</label><select id="fTeam"></select></div>
      <div class="field"><label for="fStatus">狀態</label><select id="fStatus"></select></div>
      <div class="field"><label for="fOwner">執行負責人</label><input id="fOwner" placeholder="尚未指派"></div>
      <div class="field"><label for="fContact">對接窗口／討論對象</label><input id="fContact"></div>
      <div class="field"><label for="fStart">預估開始日</label><input id="fStart" type="date"></div>
      <div class="field"><label for="fEnd">實際完成日</label><input id="fEnd" type="date"></div>
      <div class="field full"><label for="fDependency">待回覆對象</label><input id="fDependency" placeholder="例如：收到北市大課程內容"></div>
      <div class="field full"><label for="fNotes">備註</label><textarea id="fNotes"></textarea></div>
    </div>
    <div class="dialog-actions"><button type="button" class="danger" id="deleteTask">刪除此任務</button><div><button type="button" class="secondary" id="cancelDialog">取消</button> <button type="submit" class="save">儲存變更</button></div></div>
  </form>
</dialog>
<script src="app.js"></script>
</body>
</html>
